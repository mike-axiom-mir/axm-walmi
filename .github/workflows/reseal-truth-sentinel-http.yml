name: Reseal Truth Sentinel HTTP evidence

on:
  push:
    branches:
      - automation/truth-sentinel-workshop-process-evidence-20260911

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/truth-sentinel-workshop-process-evidence-20260911
          fetch-depth: 0
      - name: Remove one-shot workflow and reseal final tree
        run: |
          rm .github/workflows/reseal-truth-sentinel-http.yml
          python tools/seal_source_tree.py
          python tools/seal_source_tree.py --verify
      - name: Commit final source seal
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A .github/workflows/reseal-truth-sentinel-http.yml WALMI-SOURCE-MANIFEST.json
          git commit -s -m "chore: reseal Workshop HTTP process evidence"
          git push origin HEAD:automation/truth-sentinel-workshop-process-evidence-20260911
