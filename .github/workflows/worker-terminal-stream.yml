name: Worker terminal stream contract

on:
  pull_request:
    paths:
      - ".github/workflows/worker-terminal-stream.yml"
      - "internal/training/protocol.go"
      - "internal/training/protocol_test.go"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify changed Go formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          files = (
              "internal/training/protocol.go",
              "internal/training/protocol_test.go",
              "internal/training/python_worker.go",
          )
          failed = []
          for relative in files:
              source = Path(relative).read_bytes().replace(b"\r\n", b"\n")
              formatted = subprocess.run(
                  ["gofmt"], input=source, check=True, stdout=subprocess.PIPE
              ).stdout
              if source != formatted:
                  failed.append(relative)
                  print("".join(difflib.unified_diff(
                      source.decode().splitlines(keepends=True),
                      formatted.decode().splitlines(keepends=True),
                      fromfile=relative,
                      tofile=relative + " (gofmt)",
                  )))
          if failed:
              raise SystemExit("gofmt required: " + ", ".join(failed))
          PY
      - name: Verify terminal stream transitions
        run: go test ./internal/training -run 'Test(ReadWorkerOutputEnforcesTerminalFrameOrder|WorkerCompleteObservationValidation|ReadWorkerOutputRejectsInvalidCompletionObservation)$' -count=1
