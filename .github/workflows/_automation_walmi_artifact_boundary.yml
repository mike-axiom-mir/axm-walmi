name: Apply WALMI artifact-file boundary

on:
  push:
    branches:
      - automation/walmi-artifact-file-boundary-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/walmi-artifact-file-boundary-20260910
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch exact artifact admission boundary
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path("internal/model/observation.go")
          data = path.read_bytes()
          newline = b"\r\n" if b"\r\n" in data else b"\n"
          old = newline.join([
              b"func VerifyArtifactFile(path string, artifact training.Artifact) error {",
              b"\tfile, err := os.Open(path)",
              b"\tif err != nil {",
              b"\t\treturn fmt.Errorf(\"artifact %s: %w\", artifact.Path, err)",
              b"\t}",
          ])
          new = newline.join([
              b"func VerifyArtifactFile(path string, artifact training.Artifact) error {",
              b"\tinfo, err := os.Lstat(path)",
              b"\tif err != nil {",
              b"\t\treturn fmt.Errorf(\"artifact %s: %w\", artifact.Path, err)",
              b"\t}",
              b"\tif !info.Mode().IsRegular() {",
              b"\t\treturn fmt.Errorf(\"artifact %s is not a regular file\", artifact.Path)",
              b"\t}",
              b"\tfile, err := os.Open(path)",
              b"\tif err != nil {",
              b"\t\treturn fmt.Errorf(\"artifact %s: %w\", artifact.Path, err)",
              b"\t}",
          ])
          if data.count(old) != 1:
              raise SystemExit(f"expected one VerifyArtifactFile admission block, found {data.count(old)}")
          path.write_bytes(data.replace(old, new, 1))

          encoded = ""
          Path("internal/model/artifact_file_identity_test.go").write_bytes(base64.b64decode(encoded))
      - name: Format and focused regression
        run: |
          gofmt -w internal/model/artifact_file_identity_test.go
          go test ./internal/model -run 'TestVerifyArtifactFile|TestValidateBackendObservationVerifiesBoundsAndArtifacts' -count=1
      - name: Remove helper and reseal exact source tree
        run: |
          rm .github/workflows/_automation_walmi_artifact_boundary.yml
          python3 tools/seal_source_tree.py
          python3 tools/seal_source_tree.py --verify
      - name: Publish one-commit review branch
        run: |
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add internal/model/observation.go internal/model/artifact_file_identity_test.go WALMI-SOURCE-MANIFEST.json .github/workflows/_automation_walmi_artifact_boundary.yml
          git diff --cached --check
          git commit -s -m 'Reject non-regular training artifacts'
          implementation_sha="$(git rev-parse HEAD)"
          git switch -c automation/walmi-artifact-file-admission-20260910 6684089542569aadaa0324f56bf024d9dc190f06
          git checkout "$implementation_sha" -- internal/model/observation.go internal/model/artifact_file_identity_test.go WALMI-SOURCE-MANIFEST.json
          git add internal/model/observation.go internal/model/artifact_file_identity_test.go WALMI-SOURCE-MANIFEST.json
          git diff --cached --check
          git commit -s -m 'Reject non-regular training artifacts before admission'
          git push origin HEAD:automation/walmi-artifact-file-admission-20260910
