name: One-shot reseal Workshop process evidence

on:
  push:
    branches:
      - automation/truth-sentinel-workshop-process-evidence-20260911

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/truth-sentinel-workshop-process-evidence-20260911
          fetch-depth: 0
      - name: Remove one-shot workflow from final source inventory
        run: rm .github/workflows/reseal-workshop-process-evidence.yml
      - name: Reseal final source tree
        run: |
          python tools/seal_source_tree.py
          python tools/seal_source_tree.py --verify
      - name: Commit final seal and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reseal WALMI source after process evidence" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:automation/truth-sentinel-workshop-process-evidence-20260911
