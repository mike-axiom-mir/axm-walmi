name: Workshop stale writer gate

on:
  push:
    branches:
      - automation/state-architect-workshop-stale-writer-20260911
  pull_request:
    branches:
      - automation/truth-sentinel-workshop-transaction-20260909
    paths:
      - cmd/workshop/**
      - docs/adr/0066-workshop-stale-writer-admission.md
      - docs/adr/README.md
      - WALMI-SOURCE-MANIFEST.json
      - .github/workflows/workshop-stale-writer.yml

permissions:
  contents: read

jobs:
  stale-writer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        shell: bash
        run: |
          files="$(gofmt -l cmd/workshop/state_store.go cmd/workshop/state_store_test.go cmd/workshop/state_concurrency_test.go cmd/workshop/state_lock_nonwindows.go cmd/workshop/state_lock_windows.go)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./cmd/workshop
      - name: Focused stale-writer regression
        run: go test ./cmd/workshop -run TestWorkshopStateRejectsStaleWriter -count=1
      - name: Verify sealed source
        run: python tools/seal_source_tree.py --verify
      - name: Complete Workshop tests
        run: go test ./cmd/workshop -count=1
