name: Bootstrap public inner-asset discovery seal

on:
  push:
    branches:
      - automation/capability-weaver-public-inner-asset-discovery-v0-1

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/capability-weaver-public-inner-asset-discovery-v0-1
          fetch-depth: 0
      - name: Remove one-shot helper before computing canonical source inventory
        run: rm .github/workflows/bootstrap-public-inner-asset-discovery-seal.yml
      - name: Reseal final branch tree without the helper
        run: |
          python3 tools/seal_source_tree.py
          python3 tools/seal_source_tree.py --verify
      - name: Commit only the final seal and helper deletion
        shell: bash
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add WALMI-SOURCE-MANIFEST.json .github/workflows/bootstrap-public-inner-asset-discovery-seal.yml
          if git diff --cached --quiet; then
            echo "bootstrap produced no seal delta" >&2
            exit 1
          fi
          git commit -s -m "chore: reseal WALMI public discovery source"
          git push origin HEAD:automation/capability-weaver-public-inner-asset-discovery-v0-1
