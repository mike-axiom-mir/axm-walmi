name: Workshop UI experience

on:
  pull_request:
    paths:
      - cmd/workshop/ui.html
      - testing/workshop-ui-goal-draft.spec.js
      - .github/workflows/workshop-ui-experience.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goal-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Workshop Go tests
        run: go test ./cmd/workshop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise live-refresh goal draft loop
        run: npx playwright test testing/workshop-ui-goal-draft.spec.js --reporter=line
      - name: Rebuild source seal
        if: success()
        run: |
          python3 tools/seal_source_tree.py
          cp WALMI-SOURCE-MANIFEST.json test-results/WALMI-SOURCE-MANIFEST.json
      - name: Commit exact source seal to this PR lane
        if: success() && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- WALMI-SOURCE-MANIFEST.json; then
            echo "Source seal already matches this head."
            exit 0
          fi
          git config user.name "AXM Experience Automation"
          git config user.email "axm-experience-automation@users.noreply.github.com"
          git add WALMI-SOURCE-MANIFEST.json
          git commit -s -m "Refresh WALMI source seal for Workshop experience lane"
          git push origin "HEAD:${HEAD_REF}"
      - name: Preserve render and seal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-goal-draft-evidence
          path: test-results/*
          if-no-files-found: ignore
