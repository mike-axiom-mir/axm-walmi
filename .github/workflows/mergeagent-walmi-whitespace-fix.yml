name: MergeAgent WALMI whitespace repair

on:
  push:
    branches:
      - automation/mergeagent-walmi-consolidation-20260912

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: automation/mergeagent-walmi-consolidation-20260912
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Normalize inherited CRLF in worker protocol lane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ["docs/MODEL-LIFECYCLE.md", "internal/training/protocol.go"]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          gofmt -w internal/training/protocol.go
      - name: Remove one-shot helper before sealing
        run: rm .github/workflows/mergeagent-walmi-whitespace-fix.yml
      - name: Reseal exact repaired source tree
        run: |
          python3 tools/seal_source_tree.py
          python3 tools/seal_source_tree.py --verify
      - name: Verify complete WALMI acceptance
        run: python3 tools/test_walmi_ci.py
      - name: Verify full main-to-candidate whitespace boundary
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base"
      - name: Commit repaired exact tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AXM MergeAgent"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -s -m "Normalize worker protocol source bytes"
          git push origin HEAD:automation/mergeagent-walmi-consolidation-20260912
